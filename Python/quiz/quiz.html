<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Python Quiz</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {
            margin: 20px;

            background: white;

            color: #222;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            font-size: 18px;
        }


        /*
         * ALWAYS TWO COLUMNS.
         *
         * This remains two columns even on mobile.
         */

        .quiz {
            display: grid;

            grid-template-columns:
                minmax(0, 1fr)
                minmax(0, 1fr);

            column-gap: 35px;

            row-gap: 18px;

            width: 100%;
        }


        /*
         * Individual question area.
         *
         * There is NO hover behavior here.
         */

        .question {
            min-width: 0;

            line-height: 1.5;
        }


        /*
         * Question number is NOT interactive.
         */

        .number {
            color: #777;

            margin-right: 5px;
        }


        /*
         * ONLY THIS TEXT is interactive.
         */

        .question-text {
            cursor: pointer;

            /*
             * Allows long questions to wrap properly.
             */

            overflow-wrap: anywhere;
        }


        /*
         * Desktop:
         *
         * Hovering over the QUESTION TEXT
         * reveals the answer.
         */

        .question-text:hover + .answer {
            display: inline;
        }


        /*
         * Answer is hidden by default.
         */

        .answer {
            display: none;

            margin-left: 8px;

            color: #16803c;

            font-family:
                Consolas,
                "Courier New",
                monospace;

            overflow-wrap: anywhere;
        }


        /*
         * JavaScript adds this class when
         * the question is tapped/clicked.
         */

        .answer.show {
            display: inline;
        }


        /*
         * Small visual indication when keyboard
         * users focus on the question.
         */

        .question-text:focus {
            outline: 1px dotted #888;

            outline-offset: 3px;
        }


        /*
         * MOBILE
         *
         * Keep TWO columns.
         *
         * Reduce spacing/font slightly so it
         * remains usable on narrow screens.
         */

        @media (max-width: 600px) {

            body {
                margin: 12px;

                font-size: 15px;
            }

            .quiz {
                column-gap: 18px;

                row-gap: 14px;
            }

            .number {
                margin-right: 3px;
            }

            .answer {
                margin-left: 4px;
            }

        }


    </style>

</head>


<body>


    <div class="quiz">

        
        <div class="question">

            <span class="number">1.</span>

            <span
                class="question-text"
                tabindex="0"
                role="button"
                aria-label="Show answer"
                onclick="toggleAnswer(this)"
                onkeydown="handleKey(event, this)"
            >float(&quot;3.14&quot;)</span>

            <span class="answer">3.14</span>

        </div>
        

        <div class="question">

            <span class="number">2.</span>

            <span
                class="question-text"
                tabindex="0"
                role="button"
                aria-label="Show answer"
                onclick="toggleAnswer(this)"
                onkeydown="handleKey(event, this)"
            >str(3.14)</span>

            <span class="answer">&quot;3.14&quot;</span>

        </div>
        

        <div class="question">

            <span class="number">3.</span>

            <span
                class="question-text"
                tabindex="0"
                role="button"
                aria-label="Show answer"
                onclick="toggleAnswer(this)"
                onkeydown="handleKey(event, this)"
            >bool(1)</span>

            <span class="answer">True</span>

        </div>
        

        <div class="question">

            <span class="number">4.</span>

            <span
                class="question-text"
                tabindex="0"
                role="button"
                aria-label="Show answer"
                onclick="toggleAnswer(this)"
                onkeydown="handleKey(event, this)"
            >str(25)</span>

            <span class="answer">&quot;25&quot;</span>

        </div>
        

        <div class="question">

            <span class="number">5.</span>

            <span
                class="question-text"
                tabindex="0"
                role="button"
                aria-label="Show answer"
                onclick="toggleAnswer(this)"
                onkeydown="handleKey(event, this)"
            >bool(0)</span>

            <span class="answer">False</span>

        </div>
        

        <div class="question">

            <span class="number">6.</span>

            <span
                class="question-text"
                tabindex="0"
                role="button"
                aria-label="Show answer"
                onclick="toggleAnswer(this)"
                onkeydown="handleKey(event, this)"
            >int(&quot;42&quot;)</span>

            <span class="answer">42</span>

        </div>
        

        <div class="question">

            <span class="number">7.</span>

            <span
                class="question-text"
                tabindex="0"
                role="button"
                aria-label="Show answer"
                onclick="toggleAnswer(this)"
                onkeydown="handleKey(event, this)"
            >int(float(&quot;7.9&quot;))</span>

            <span class="answer">7</span>

        </div>
        

        <div class="question">

            <span class="number">8.</span>

            <span
                class="question-text"
                tabindex="0"
                role="button"
                aria-label="Show answer"
                onclick="toggleAnswer(this)"
                onkeydown="handleKey(event, this)"
            >int(3.9)</span>

            <span class="answer">3</span>

        </div>
        

        <div class="question">

            <span class="number">9.</span>

            <span
                class="question-text"
                tabindex="0"
                role="button"
                aria-label="Show answer"
                onclick="toggleAnswer(this)"
                onkeydown="handleKey(event, this)"
            >float(int(8.9))</span>

            <span class="answer">8.0</span>

        </div>
        

        <div class="question">

            <span class="number">10.</span>

            <span
                class="question-text"
                tabindex="0"
                role="button"
                aria-label="Show answer"
                onclick="toggleAnswer(this)"
                onkeydown="handleKey(event, this)"
            >float(3)</span>

            <span class="answer">3.0</span>

        </div>
        

    </div>


    <script>

        /*
         * ====================================================
         * MOBILE / CLICK SUPPORT
         * ====================================================
         *
         * Tap/click the QUESTION TEXT to show/hide its answer.
         */

        function toggleAnswer(element) {

            const answer = element.nextElementSibling;

            answer.classList.toggle("show");

        }


        /*
         * Keyboard support.
         *
         * Enter or Space will also reveal/hide
         * the answer.
         */

        function handleKey(event, element) {

            if (
                event.key === "Enter" ||
                event.key === " "
            ) {

                event.preventDefault();

                toggleAnswer(element);

            }

        }

    </script>


</body>

</html>
