<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding: 0;
            box-sizing:border-box;
        }
        .box{
            background-color: yellow;
            height:50px;
            width:1921px;
        }
        .box2{
            background-color: red;
            height:2px;
            width:100%;
        }
        .box3{
            background-color: green;
            height:1in;
            width:100%;
        }
        .box4{
            background-color: blue;
            height:1cm;
            width:100%;
        }
        .box5{
            background-color: purple;
            height:1mm;
            width:100%;
        }
    </style>
</head>
<body>
    <h1>css units</h1>
    <h2>1. px (pixels)</h2>
    <p>Pixel is the smallest unit of measurement in CSS. It represents a single dot on the screen.</p>
    <div class="box">hello<br>h</div>
    <br>
    <div class="box2"></div>
    <br>
    
    <div class="box3">inch</div>

    <div class="box4">cm</div>
    <div class="box5">mm</div>
</body>
</html>
