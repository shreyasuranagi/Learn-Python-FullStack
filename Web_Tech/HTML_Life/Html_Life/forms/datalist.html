<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Datalist</h1>
    <form>
    <label for="fruit">Fruits: </label>
    <input type="email" id="fruit" name='fruit' placeholder="select a fruit" list="fruits">
    <datalist id="fruits">
        <option disabled selected>Select</option>
        <option name="fruit" value="apple">Apple</option>
        <option name="fruit" value="mango">Mango</option>
        <option name="fruit" value="banana">Banana</option>
    </datalist>
    

    <hr>
    <h2>Select</h2>
    <label for="fruit">Fruits: </label>
    <select name="fruit" id="fruit">
        <option
    disabled selected>Select</option>
        <option name="fruit" value="apple">Apple</option>
        <option name="fruit" value="mango">Mango</option>
        <option name="fruit" value="banana">Banana</option><br>
        <!-- <button>Submit</button> -->
    </select>
<input type="submit">
<!-- <button>Submit</button> -->
    </form>
</body>
</html>
