<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form>
        <label for="name">username: </label><input name="uname"type="text" value="shreya" readonly placeholder="user name here"> <br><br>

        <label for="email">useremail: </label><input name="emailid" type="name" id="name" autofocus placeholder="mail id goes here"> <br><br>

        <label for="age">age: </label><input name="age" id="age" type="number" min="18" max="60" placeholder="age goes here"> <br><br>

        <label for="dob">dob: </label><input name="dob" id="dob" type="date" placeholder="date of birth"> <br><br>

        <label for="ph">ph: </label><input name="ph" id="ph" type="tel" size="10" maxlength ="10" placeholder="phone number goes here"> <br><br>

        <label for="color">color: </label><input id="color" type="color" placeholder="select a color"> <br><br>

        <label for="datetime">datetime: </label><input name="datentime" id="datetime" type="datetime-local"
            placeholder="select a date and time"> <br><br>

        <label>Gender:</label> <br>
        <input name="gender" type="radio"><label for="">Male</label><br>
        <input name="gender" type="radio"> <label for="">Female</label><br>
        <input name="gender" type="radio"> <label for="">Other</label><br><br>

        <label>Skills:</label>
        <input name="skills" type="checkbox"><label for="">HTML</label>
        <input name="skills" type="checkbox"><label for="">CSS</label>
        <input name="skills" type="checkbox"><label for="">JS</label>
        <input name="skills" type="checkbox"><label for="">PHP</label><br>

        <label>Feedback:<br></label><textarea rows="10" cols="30">Feedback:</textarea>

        <select>
            <option selected disabled>select</option>
            <option name="skills">html</option>
            <option name="skills">css</option>
        </select><br>
        <br>
        <input type="File">
        <button>submit</button><br>
        
    </form>
</body>

</html>
