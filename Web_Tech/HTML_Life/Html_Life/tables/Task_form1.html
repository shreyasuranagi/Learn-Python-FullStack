<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>My Feedback form</h1>
    <form>
       <fieldset>
        <legend>job application</legend>
         <ul>
        <li>
            <label for="name">Name: </label><input id="name" value="somu" type="text" size="7" minlength="5" maxlength="12" readonly></li>
        <li><label for="email">Email: </label><input id="email" type="email" readonly></li>
        <li><label for="password">Password:</label> <input id="password" type="password"></li>
        <li><Label>Age</Label><input type="number" min ="19" max="120"></li>
        <li>Please check all the emotions that apply to you:
            <ul type="disc">
                <li><label for="angry">Angry</label> <input type="checkbox" id="angry" name="emotions"></li>
                <li><label for="sad">Sad</label> <input type="checkbox" id="sad" name="emotions"></li>
                <li><label for="happy">Happy</label> <input type="checkbox" id="happy" name="emotions"></li>
                <li><label for="ambivalent">Ambivalent</label> <input type="checkbox" id="ambivalent" name="emotions"></li>
            </ul>
        </li>
        <li>
            How satisfied were you with our service?<br>
            <ul type="disc">
                <li><label for="verysatisfied">Very satisfied</label><input type="radio" id="verysatisfied" name="satisfaction"></li>
                <li><label for="satisfied">Satisfied</label><input type="radio" id="satisfied" name="satisfaction"></li>
                <li><label for="didn't care">Didn't care</label><input type="radio" id="didn't care" name="satisfaction"></li>
                <li><label for="dissatisfied">Dissatisfied</label><input type="radio" id="dissatisfied" name="satisfaction"></li>
                <li><label for="verydissatisfied">Very dissatisfied</label><input type="radio" id="verydissatisfied" name="satisfaction"></li>
            </ul> 
        </li>
        
            <li>Further comments:<input type="text"></li>
        <!-- <li>Bio photo:<input type="text"><button>Choose</button></li> -->
         <li>Bio Photo</li><input type="file">
        <li>Location visited:</li>
        
        </ul>
        <label>SKills:</label>
        <select name="">
            <option value="" disabled selected>select your option</option>
            <option value="">html</option>
            <option value="" selected>css</option>
            <option value="">javascript</option>
            <option value="" selected>python</option>
            <option value="">reactjs</option>
        </select>
        <input type="url">
        <input type="reset">
        <input type="search" placeholder="Search...">
        <input type="hidden" value="user" name="role"><br>
        <textarea placeholder="Enter your comments here..." rows="20" cols="50"></textarea><br>
        <input type="image" src="https://thumbs.dreamstime.com/b/submit-word-round-red-button-16243334.jpg">
        <button>Submit</button>
       </fieldset>

    </form>
</body>
</html>
