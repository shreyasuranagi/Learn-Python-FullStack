<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin:0px;
            padding:0px;
            box-sizing:border-box;
            background-color:black;
        }
        body{
            height:100vh;
            width:100vw;
            display:flex;
            justify-content:center;
            align-items:center;
            
            
            
        }
        .child{
            width:80px;
            height:80px;
            background-color:gold;
            position:absolute;
            border-radius:50%;
            top:30px;
            box-shadow:2px 2px 13px gold;
        }
        .main{
            width:350px;
            height:350px;
            border:2px solid white;
            border-radius:50%;
            /* animation-name:planet;
            animation-duration:10s;
            animation-iteration-count:infinite; */
            animation: planet 10s linear infinite;
            box-shadow: 1px 1px 10px white;
            position:relative;
            /* transform: skewX(60deg); */
        }

        @keyframes planet{
            0%{

            }
            100%{
                transform: rotate(360deg);
            }
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="child"></div>
    </div>
</body>
</html>
