<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        
        .outer{
            width:500px;
            height:500px;
            border:2px solid orange;
        }
        .block{
            width:150px;
            height:150px;
            background-color: green;
            display:inline-block;
        }
        .inlin{
            background-color: red;
            width:50px;
            height: 50px;
            /* margin: 10px; */
            display:inline-block;
        }
    </style>
</head>
<body>
    <h1>
        inline-block
    </h1>

    <div class="outer">
        <div class="block">block 1 -div</div>
        <div class="block">block 2-div</div>
        <span class="inlin">inline1-span</span>
        <span class="inlin">inline2-span</span  >
    </div>
</body>
</html>
