<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            width:600px;
            height:400px;
            border:3px green solid;
            position: absolute;
        }
        .box{
            border:2px solid blue;
            height: 100px;
            width: 100px;
        }
        #box1{
            position: relative;
            top:0px;
        }
        #box2{
            position: absolute;
            right:0px;
            top:0px;
        }
        #box3{
            position: absolute;
            left:250px;
            /* top:150px; */
            top:50%-50px;
        }
        #box4{
            position: absolute;
            bottom:0px;
            
        }
        #box5{
            position: absolute;
            bottom:0px;
            right:0px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box" id="box1">1</div>
        <div class="box" id="box2">2</div>
        <div class="box" id="box3">3</div>
        <div class="box" id="box4">4</div>
        <div class="box" id="box5">5</div>
    </div>
</body>
</html>
