<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            width: 500px;
            height: 600px;
            border:5px blue solid;
        }
        .box{
            width: 100px;
            height: 100px;
            border:2px solid red;
        }
        #box1{
            margin-left:50px;
            position:relative;
            /* bottom:30px; */
            left:20px;
        }
        #box2{
            position:absolute;
            right:150px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box" id="box1">box1(static)</div>
        <div class="box" id="box2">box2(relative)</div>
        <div class="box" id="box3">box3</div>
        <div class="box" id="box4">box4</div>
    </div>
</body>
</html>
