<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing:border-box;
        }
        body{
            height:100vh;
            width:100vw;
            display:flex;
            justify-content: center;
            align-items:center;
        }
        .outer{
            width: 100px;
            height: 100px;
            border:2px solid black;
            text-align:center;
            font-size:30px;
            /* color:white; */
            font-weight: 900;
        }
        
        
        @media (orientation: portrait)
        {
            .outer{
                transform:rotate(180deg)
            }
        }
        @media (orientation:landscape)
        {
            .outer{
                background-color: aqua;
                color:white;
                border:none;
                transform:scale(3);
            }
        }



    </style>
</head>
<body>
    <div class="outer">Hello!</div>
</body>
</html>
