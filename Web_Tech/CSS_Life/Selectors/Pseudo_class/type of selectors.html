<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        li:nth-of-type(2n){
            background-color:palevioletred;
            color:white;
        }
        li:first-of-type{
            background-color:blue;
        }
        li:last-of-type{
            background-color:red;
        }
    </style>
</head>
<body>
    <h2>Type of selectors in Pseudo element selectors</h2>
    <h2>nth of type</h2>
    <ul>
        <li>List 1</li>
        <li>List 2</li>
        <li>List 3</li>
        <li>List 4</li>
        <li>List 5</li>
        <li>List 6</li>
        <li>List 7</li>
        <li>List 8</li>
        <li>List 9</li>
        
    </ul>
</body>
</html>
