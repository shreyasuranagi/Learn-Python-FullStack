<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding:0px;
            margin:0px;
        }
        .box{
            border: 25px orange solid;
            height: 150px;
            width: 250px;
            margin:10px;
        }
        .inner{
            margin: 30px 15px 10px;
            /* border: 2px solid black; */
            background-color: black;
            color:red;
            padding:3px;
            /* padding-left:20px; */
            text-align:center;

        }
        .second{
            margin: 20px 15px 10px;
            background-color: black;
            color:red;
            font-size: 14px;
            text-align:center
        }
        </style>
</head>
<body> 
    <h1>CSS Box-Model Property</h1>
    <div class="box">
        <div class="inner"><h3>Simplilearn</h3></div>
        <div class="second"><b>World's #1 Online Certification Course Provider</b></div>
    </div>
</body>
</html>
