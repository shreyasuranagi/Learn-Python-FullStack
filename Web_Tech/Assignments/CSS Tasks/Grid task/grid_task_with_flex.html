<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>.container{
        width: 100%;
        height:90vh;
        border:2px solid;
        display:flex;
        flex-direction:column;
    }
    .row1,.row2{
        display:flex;
        border:2px solid blue;
        flex-direction:row;
        justify-content:space-between;
        column-gap:10px;
    }
    .row1 .box{ 
        /* flex-basis:50%; */
         flex-grow:1; }
    .row2 .box{
        flex-grow:2;
    }
    .box{
        border:2px solid red;
    }</style>
    
</head>
<body>
    <div class="container">
        <div class="row1">
            <div class="box" id="box1">box1</div>
            <div class="box" id="box2">box2</div>
            <div class="box" id="box3">box3</div>
            <div class="box" id="box4">box4</div>
            <div class="box" id="box5">box5</div>
            <div class="box" id="box6">box6</div>
            <div class="box" id="box7">box7</div>
            <div class="box" id="box8">box8</div>
            <div class="box" id="box9">box9</div>
            <div class="box" id="box10">box10</div>
            <div class="box" id="box11">box11</div>
            <div class="box" id="box12">box12</div>
        </div>
        <div class="row2">
            <div class="box" id="box1">box1</div>
            <div class="box" id="box2">box2</div>
            <div class="box" id="box3">box3</div>
            <div class="box" id="box4">box4</div>
            <div class="box" id="box5">box5</div>
            <div class="box" id="box6">box6</div>
        </div>
        <div class="row3"></div>
        <div class="row4"></div>
        <div class="row5"></div>
        <div class="row6"></div>
        <div class="row7"></div>
        <div class="row8"></div>
        <div class="row9"></div>
        <div class="row10"></div>
    </div>
</body>
</html>
